[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limen"
version = "0.1.0"
description = "Container image for the Muse Gadget Linux device service"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = []
force-include = { "shim.py" = "limen/shim.py" }

[tool.mypy]
strict = true
files = ["shim.py", "patch_subscribe.py", "patch_network.py"]

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=90 --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["test_*.py", "patch_network.py"]

[tool.coverage.report]
show_missing = true
