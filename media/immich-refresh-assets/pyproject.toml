[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "immich-refresh-assets"
version = "0.1.0"
description = "Trigger metadata + thumbnail regeneration jobs for Immich assets"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = ["immich"]

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov"]

[tool.uv.sources]
immich = { git = "https://github.com/streambinder/unciae.git", branch = "master", subdirectory = "media/immich" }

[tool.hatch.build.targets.wheel]
packages = []
force-include = { "main.py" = "immich_refresh_assets/main.py" }

[tool.mypy]
strict = true
files = ["main.py"]

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=90 --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["test_*.py"]
