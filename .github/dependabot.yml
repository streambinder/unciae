version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/ai/ianua"
      - "/audio/inflarics"
      - "/audio/pluffer"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    open-pull-requests-limit: 25
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directories:
      - "/backup/restup"
      - "/media/immich"
      - "/media/immich-album-assets"
      - "/media/immich-prune-trash"
      - "/media/immich-refresh-assets"
      - "/media/immich-scan"
      - "/platform/renovo"
      - "/tui/anchor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 25
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
